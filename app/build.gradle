plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystore = System.getenv('VEDAX_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('VEDAX_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('VEDAX_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('VEDAX_RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'vn.vedax.hardwaretest'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'vn.vedax.hardwaretest'
        minSdk 26
        targetSdk 33
        versionCode 7
        versionName '0.4.0'
    }

    signingConfigs {
        if (releaseSigningReady) {
            create('release') {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "VedaX-Hardware-Test-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
